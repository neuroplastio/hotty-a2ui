- name: A Confirm of two Buttons and four HottyShortcuts starts on No; ArrowLeft and ArrowRight move between Yes and No, Enter presses the one with the keyboard, y and n press Yes and No, with the keyboard or without it
  story: hotty/confirm
  steps:
    - expect: {focused: no, actions: []}
    - key: arrow_left
    - expect: {focused: yes, actions: []}
    - key: arrow_left
    - expect: {focused: yes}
    - key: arrow_right
    - expect: {focused: no}
    - key: enter
    - expect: {focused: no, actions: [keep]}
    - key: arrow_left
    - key: space
    - expect: {focused: yes, actions: [keep, delete], context: {files: [notes.md, todo.md, draft.md]}}
    - key: n
    - expect: {focused: yes, actions: [keep, delete, keep]}
    - key: y
    - expect: {focused: yes, actions: [keep, delete, keep, delete]}
    - blur: true
    - key: n
    - expect: {focused: null, actions: [keep, delete, keep, delete, keep]}

- name: A Confirm in a HottyForm; in a field y and n type and the arrows move the caret, on Yes and No they answer; Enter in a field submits
  story: hotty/confirm-form
