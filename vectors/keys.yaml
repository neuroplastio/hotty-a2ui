# A HottyMarkdown's links in place (profile §6.27): Tab stops in the
# text's order, which Enter or a click follows. A relative one is written
# where link is bound and sends onLink; a #fragment takes the keyboard to
# its heading (on a host the heading's own focus, which reads as its
# document) and sends nothing.
- name: Tab goes through a HottyMarkdown's links in place; Enter follows a relative one, written to link before onLink runs
  story: hotty/markdown
  steps:
    - focus: page/link/0
    - expect: {focused: page/link/0}
    - key: enter
    - expect: {focused: page/link/0, actions: [open], context: {href: guide.md}, data: {/page/link: guide.md}}
    - key: tab
    - expect: {focused: page/link/1}
    - key: shift+tab
    - expect: {focused: page/link/0}

- name: "Enter on a #fragment link in place takes the keyboard to its heading's document and sends nothing"
  story: hotty/markdown
  steps:
    - focus: page/link/1
    - key: enter
    - expect: {focused: page, actions: [], data: {/page/link: nothing yet}}

- name: A click on a link in place follows it
  story: hotty/markdown
  steps:
    - click: page/link/0
    - expect: {focused: page/link/0, actions: [open], context: {href: guide.md}}
    - click: page/link/2
    - expect: {focused: page, actions: [open]}

- name: "Tab from a heading a #fragment went to goes on from there, as a browser does"
  story: hotty/markdown
  steps:
    - focus: page/link/1
    - key: enter
    - expect: {focused: page}
    - key: tab
    - expect: {focused: page/link/3}
    - focus: page/link/1
    - key: enter
    - key: shift+tab
    - expect: {focused: page/link/2}

# A HottyFilePicker (profile §6.31): arrow keys move, right arrow and Enter
# open a directory or pick a file, left arrow, h, Backspace and Escape go
# up to parent directory.
- name: HottyFilePicker moves with arrows, enters directories, picks files, and goes up with Escape
  story: hotty/filepicker
  steps:
    - focus: fp
    - expect: {focused: fp}
    - key: arrow_down
    - key: arrow_down
    - key: enter
    - expect: {focused: fp, actions: [filePicked], data: {/picked: go.mod, /dir: ""}}
    - key: home
    - key: enter
    - expect: {focused: fp, actions: [filePicked, dirChanged], data: {/dir: docs}}
    - key: escape
    - expect: {focused: fp, actions: [filePicked, dirChanged, dirChanged], data: {/dir: ""}}


# A HottyPicker (profile §6.32): a command palette. The agent (the story's
# program) ranks the rows for each query, which the picker edits as a text
# field's; the arrows move the selection round; Enter and an action's key
# run a row's action; mod+k lists the selected row's actions.
- name: HottyPicker edits its query, which the agent answers, and runs the selected row's actions
  story: hotty/picker
  keys: terminal
  steps:
    - focus: palette
    - expect: {focused: palette, data: {/selected: ""}}
    - key: arrow_down
    - expect: {data: {/selected: tab.new}}
    - key: enter
    - expect: {actions: [act], context: {row: tab.new, action: run}, data: {/status: run tab.new}}
    - type: zoom
    - expect: {actions: [act, query, query, query, query], data: {/query: zoom, /selected: ""}}
    - key: enter
    - expect: {context: {row: pane.zoom, action: run}}
    - key: ctrl+w
    - expect: {data: {/query: ""}}
    - key: arrow_up
    - expect: {data: {/selected: session.quit}}
    - key: arrow_down
    - key: arrow_down
    - key: arrow_down
    - expect: {data: {/selected: p-1}}
    - key: shift+delete
    - expect: {context: {row: p-1, action: close}}
    - key: ctrl+k
    - key: arrow_down
    - key: arrow_down
    - key: enter
    - expect: {focused: palette, context: {row: p-1, action: copy}}
    - key: arrow_down
    - key: arrow_down
    - key: enter
    - expect: {context: {row: p-3, action: focus}, data: {/status: bastion is not reachable, /statusKind: error}}

- name: HottyPicker completes its query to the selected row on Tab, and keeps the keyboard
  story: hotty/picker
  keys: terminal
  steps:
    - focus: palette
    - type: zo
    - key: tab
    - expect: {focused: palette, data: {/query: Zoom}}
    - type: x
    - expect: {focused: palette, data: {/query: Zoomx}}
