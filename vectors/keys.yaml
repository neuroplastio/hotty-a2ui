# Keys and focus, the same in both renditions (NEIO-11): each vector runs
# against the cells rendition and against the HTML rendition on a host
# (hottytest, which takes keys as SPEC §10.2 has a host take them).
#
# A vector is a story (story: a name, or messages: inline), the keymap of
# its text fields (keys: a data-keys value, or "terminal" for
# hotty.TerminalKeys; the default keymap alone when not given, as the
# renditions start), the host's Mod (mod: super for a Mac's keys, SPEC
# §10.4; ctrl when not given) and steps:
#   key: a key, as SPEC §10.4 names it ("tab", "shift+tab", "space", "ctrl+s")
#   type: characters, one key each (a capital is shift with its letter)
#   focus: the program gives the keyboard at an element (by view id)
#   blur: the program takes it back
#   click: the user clicks an element (by view id)
#   tap: {on: a Slider's or a HottyRangeSlider's view id, at: a value}:
#     a click on its track where it stands for the value; {on: a
#     HottyPaginator's, at: a page from 1}: a click on that page's dot
#   press: {on, at}, then move: {at} and release: {at}: a drag along that
#     track, from its press to its release (on the host, as one that says
#     where on the track the pointer is, SPEC §9.1's steps)
#   expect:
#     focused: the element with the keyboard, by view id; null for none
#     actions: the names of every action the agent has had, in order
#     context: the last action's context (the keys given)
#     data: data model values, by path
#     toasts: the ids of the toasts the surface shows, the newest first
#       (hottyToast, profile §6.23)
# A vector with renditions (cells, host) plays on those alone: what the
# other's baseline does not do yet, which the vector's name says.
- name: Tab goes in tree order through every kind of control, and out past the last
  messages: &controls
    - {version: v1.0, createSurface: {surfaceId: s, catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json", dataModel: {name: "", agree: false, size: [], level: 3}}}
    - version: v1.0
      updateComponents:
        surfaceId: s
        components:
          - {id: root, component: Column, children: [name, agree, size, tabs, go, level]}
          - {id: name, component: TextField, label: Name, value: {"@path": /name}}
          - {id: agree, component: CheckBox, label: Agree, value: {"@path": /agree}}
          - {id: size, component: ChoicePicker, label: Size, variant: multipleSelection, displayStyle: chips, value: {"@path": /size}, options: [{label: S, value: s}, {label: M, value: m}]}
          - {id: tabs, component: Tabs, tabs: [{title: One, child: one}, {title: Two, child: two}]}
          - {id: one, component: Text, text: In one}
          - {id: two, component: Button, child: two_t, action: {event: {name: inTwo}}}
          - {id: two_t, component: Text, text: In two}
          - {id: go, component: Button, child: go_t, action: {event: {name: go, context: {name: {"@path": /name}, agree: {"@path": /agree}}}}}
          - {id: go_t, component: Text, text: Go}
          - {id: level, component: Slider, label: Level, min: 0, max: 10, value: {"@path": /level}}
  steps:
    - focus: name
    - expect: {focused: name}
    - key: tab
    - expect: {focused: agree}
    - key: tab
    - expect: {focused: size/option/0}
    - key: tab
    - expect: {focused: size/option/1}
    - key: tab
    - expect: {focused: tabs/tab/0}
    - key: tab
    - expect: {focused: tabs/tab/1}
    - key: tab
    - expect: {focused: go}
    - key: tab
    - expect: {focused: level}
    - key: tab
    - expect: {focused: null}

- name: shift+tab goes back, and out before the first
  messages: *controls
  steps:
    - focus: agree
    - key: shift+tab
    - expect: {focused: name}
    - key: shift+tab
    - expect: {focused: null}

- name: Space and Enter on a Button run it; Space on a CheckBox and a chip toggles it
  messages: *controls
  steps:
    - focus: name
    - type: Ada
    - key: tab
    - key: space
    - expect: {focused: agree, data: {/agree: true, /name: Ada}}
    - key: tab
    - key: space
    - key: tab
    - key: enter
    - expect: {focused: size/option/1, data: {/size: [s, m]}}
    - focus: go
    - key: enter
    - expect: {actions: [go], context: {name: Ada, agree: true}}
    - key: space
    - expect: {focused: go, actions: [go, go]}

- name: Enter and Space on a tab show it; its content then joins the Tab order
  messages: *controls
  steps:
    - focus: tabs/tab/1
    - key: enter
    - expect: {focused: tabs/tab/1}
    - key: tab
    - expect: {focused: two}
    - key: space
    - expect: {actions: [inTwo]}

- name: A HottyShortcut presses its Button, with the field just typed in current, and the field keeps the keyboard
  story: hotty/shortcut-press
  steps:
    - key: ctrl+s
    - expect: {actions: []}
    - focus: note
    - type: hello
    - key: ctrl+s
    - expect: {focused: note, actions: [save], context: {note: hello}}

- name: A HottyShortcut presses its Button only when the Button's checks pass
  story: hotty/shortcut-press
  steps:
    - focus: note
    - key: ctrl+s
    - expect: {focused: note, actions: []}

- name: A HottyShortcut runs its own Action, the keyboard anywhere or nowhere
  story: hotty/shortcut-action
  steps:
    - key: ctrl+r
    - expect: {focused: null, actions: [refresh], context: {shown: 3}}
    - focus: filter/option/1
    - key: ctrl+r
    - expect: {focused: filter/option/1, actions: [refresh, refresh]}

- name: A bare key is the field's while a text control has the keyboard, else the HottyShortcut's
  messages:
    - {version: v1.0, createSurface: {surfaceId: s, catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json", dataModel: {q: ""}}}
    - version: v1.0
      updateComponents:
        surfaceId: s
        components:
          - {id: root, component: Column, children: [q, go, help]}
          - {id: q, component: TextField, label: Search, value: {"@path": /q}}
          - {id: go, component: Button, child: go_t, action: {event: {name: search, context: {q: {"@path": /q}}}}}
          - {id: go_t, component: Text, text: Search}
          - {id: help, component: HottyShortcut, catalogId: "https://hotty.neuroplast.io/a2ui/v1/catalog", key: "?", action: {event: {name: help}}}
  steps:
    - focus: q
    - type: "why?"
    - expect: {focused: q, actions: [], data: {/q: "why?"}}
    - key: tab
    - key: "?"
    - expect: {focused: go, actions: [help]}
    - key: enter
    - expect: {actions: [help, search], context: {q: "why?"}}

- name: Enter in a field submits its HottyForm, which runs only when every check inside passes
  story: hotty/form
  steps:
    - focus: name
    - type: Ada
    - key: enter
    - expect: {focused: name, actions: []}
    - key: tab
    - type: ada@example.com
    - key: enter
    - expect: {actions: []}
    - focus: agree
    - key: space
    - focus: email
    - key: enter
    - expect: {focused: email, actions: [signUp], context: {name: Ada, email: ada@example.com, plan: [free]}}

- name: Space on a CheckBox toggles it, and Enter submits its HottyForm, as a host takes a checkbox
  story: hotty/form
  steps:
    - focus: name
    - type: Ada
    - focus: email
    - type: ada@example.com
    - focus: agree
    - key: enter
    - expect: {focused: agree, actions: [], data: {/agree: false}}
    - key: space
    - expect: {focused: agree, data: {/agree: true}}
    - key: enter
    - expect: {focused: agree, actions: [signUp], data: {/agree: true}}

- name: Enter on a CheckBox outside a HottyForm does nothing
  messages: *controls
  steps:
    - focus: agree
    - key: enter
    - expect: {focused: agree, actions: [], data: {/agree: false}}

- name: arrows step a focused Slider, Home and End go to its ends
  messages: *controls
  steps:
    - focus: level
    - key: arrow_right
    - expect: {focused: level, data: {/level: 3.5}}
    - key: arrow_left
    - key: arrow_down
    - expect: {focused: level, data: {/level: 2.5}}
    - key: end
    - expect: {data: {/level: 10}}
    - key: arrow_up
    - expect: {data: {/level: 10}}
    - key: home
    - expect: {focused: level, data: {/level: 0}}

- name: hottyFocus and hottyBlur move the keyboard; autofocus takes it at the start
  story: hotty/focus-blur
  steps:
    - expect: {focused: name}
    - key: tab
    - key: tab
    - expect: {focused: to_city}
    - key: enter
    - expect: {focused: city}
    - key: tab
    - key: tab
    - expect: {focused: done}
    - key: space
    - expect: {focused: null}
    - focus: city
    - expect: {focused: city}
    - blur: true
    - expect: {focused: null}

# Text fields edit by their keymap (SPEC §10.2): the surface's, the
# renditions' hotty.TerminalKeys unless a vector says, then the
# components' own (io_neuroplast_hotty.keys), the field's last. Typing
# after a move shows where it left the caret.
- name: the terminal keymap moves and deletes by characters, words and lines
  keys: terminal
  messages: &field
    - {version: v1.0, createSurface: {surfaceId: s, catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json", dataModel: {t: ""}}}
    - version: v1.0
      updateComponents:
        surfaceId: s
        components:
          - {id: root, component: Column, children: [t]}
          - {id: t, component: TextField, label: Text, value: {"@path": /t}}
  steps:
    - focus: t
    - type: foo bar baz
    - key: ctrl+w
    - expect: {data: {/t: "foo bar "}}
    - key: alt+b
    - type: x
    - expect: {data: {/t: "foo xbar "}}
    - key: home
    - type: "<"
    - key: ctrl+e
    - type: ">"
    - expect: {data: {/t: "<foo xbar >"}}
    - key: alt+b
    - key: alt+b
    - key: ctrl+k
    - expect: {data: {/t: "<foo "}}
    - key: ctrl+b
    - key: ctrl+b
    - key: ctrl+u
    - expect: {data: {/t: "o "}}
    - key: ctrl+f
    - key: ctrl+h
    - type: z
    - key: ctrl+d
    - expect: {focused: t, data: {/t: "z"}}

- name: with Shift a move selects from where the caret was, and typing or deleting replaces the selection; a key the keymap does not name is the program's
  messages: *field
  steps:
    - focus: t
    - type: abc
    - key: shift+arrow_left
    - type: x
    - expect: {data: {/t: "abx"}}
    - key: arrow_left
    - key: shift+home
    - key: backspace
    - expect: {data: {/t: "x"}}
    - type: "yz"
    - key: alt+shift+arrow_left
    - type: "!"
    - key: ctrl+g
    - key: F5
    - expect: {focused: t, data: {/t: "!x"}}

- name: ctrl+a selects all, in the terminal keymap as in the default, and Home still goes to the line's start
  keys: terminal
  messages: *field
  steps:
    - focus: t
    - type: foo bar
    - key: ctrl+a
    - type: x
    - expect: {data: {/t: "x"}}
    - type: yz
    - key: home
    - type: "<"
    - key: ctrl+a
    - key: delete
    - expect: {focused: t, data: {/t: ""}}

- name: the default keymap alone selects all with ctrl+a and moves by words with Control and the arrows, leaving alt+b to the program
  keys: ""
  messages: *field
  steps:
    - focus: t
    - type: ab cd
    - key: ctrl+a
    - type: x
    - key: alt+b
    - type: " y"
    - key: ctrl+arrow_left
    - type: "<"
    - expect: {focused: t, data: {/t: "x <y"}}

- name: macOS's Command keys, as Meta, go to the line's ends, delete to its start and select all, with Shift selecting
  keys: ""
  mod: super
  messages: *field
  steps:
    - focus: t
    - type: ab cd
    - key: super+arrow_left
    - type: "<"
    - key: super+arrow_right
    - type: ">"
    - expect: {data: {/t: "<ab cd>"}}
    - key: super+backspace
    - type: x
    - key: super+a
    - type: "yz"
    - key: super+shift+arrow_left
    - type: "!"
    - expect: {focused: t, data: {/t: "!"}}

- name: row moves in a multi-line field keep their place along the row
  keys: terminal
  messages:
    - {version: v1.0, createSurface: {surfaceId: s, catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json", dataModel: {t: ""}}}
    - version: v1.0
      updateComponents:
        surfaceId: s
        components:
          - {id: root, component: Column, children: [t]}
          - {id: t, component: TextField, label: Notes, variant: longText, value: {"@path": /t}}
  steps:
    - focus: t
    - type: abcdef
    - key: enter
    - type: ab
    - key: enter
    - type: abcdef
    - key: arrow_up
    - type: "1"
    - expect: {data: {/t: "abcdef\nab1\nabcdef"}}
    - key: end
    - key: ctrl+n
    - type: "2"
    - expect: {data: {/t: "abcdef\nab1\nabc2def"}}
    - key: arrow_up
    - key: arrow_up
    - type: "3"
    - expect: {data: {/t: "abcd3ef\nab1\nabc2def"}}
    - key: alt+>
    - type: "4"
    - key: alt+<
    - type: "5"
    - expect: {focused: t, data: {/t: "5abcd3ef\nab1\nabc2def4"}}

- name: a password field is one word
  keys: terminal
  messages:
    - {version: v1.0, createSurface: {surfaceId: s, catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json", dataModel: {p: ""}}}
    - version: v1.0
      updateComponents:
        surfaceId: s
        components:
          - {id: root, component: Column, children: [p]}
          - {id: p, component: TextField, label: Password, variant: obscured, value: {"@path": /p}}
  steps:
    - focus: p
    - type: correct horse
    - key: alt+b
    - type: "<"
    - key: alt+f
    - type: ">"
    - expect: {data: {/p: "<correct horse>"}}
    - key: ctrl+w
    - expect: {focused: p, data: {/p: ""}}

- name: a component's keymap overrides the surface's key by key, its fields' own last
  keys: terminal
  messages:
    - {version: v1.0, createSurface: {surfaceId: s, catalogId: "https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json", dataModel: {name: "", note: ""}}}
    - version: v1.0
      updateComponents:
        surfaceId: s
        components:
          - {id: root, component: Column, children: [form, clear]}
          - id: form
            component: HottyForm
            catalogId: "https://hotty.neuroplast.io/a2ui/v1/catalog"
            child: fields
            onSubmit: {event: {name: send, context: {name: {"@path": /name}}}}
            metadata: {extensions: {io_neuroplast_hotty: {keys: "ctrl+s=submit ctrl+k=program"}}}
          - {id: fields, component: Column, children: [name, note]}
          - {id: name, component: TextField, label: Name, value: {"@path": /name}}
          - id: note
            component: TextField
            label: Note
            value: {"@path": /note}
            metadata: {extensions: {io_neuroplast_hotty: {keys: "ctrl+k=delete-to-line-end"}}}
          - {id: clear, component: HottyShortcut, catalogId: "https://hotty.neuroplast.io/a2ui/v1/catalog", key: ctrl+k, action: {event: {name: clear}}}
  steps:
    - focus: name
    - type: Ada
    - key: ctrl+a
    - key: ctrl+k
    - expect: {actions: [clear], data: {/name: Ada}}
    - key: ctrl+s
    - expect: {actions: [clear, send], context: {name: Ada}}
    - focus: note
    - type: hi there
    - key: alt+b
    - key: ctrl+k
    - expect: {focused: note, actions: [clear, send], data: {/note: "hi "}}

- name: A HottyTable's keys move its selection to the bound path, and Enter acts on the row selected
  story: hotty/table
  steps:
    - focus: table
    - expect: {focused: table, data: {/selected: Tokyo}}
    - key: arrow_down
    - expect: {focused: table, data: {/selected: Delhi}}
    - key: page_down
    - expect: {data: {/selected: Mumbai}}
    - key: end
    - expect: {data: {/selected: Karachi}}
    - key: arrow_down
    - expect: {data: {/selected: Karachi}}
    - key: home
    - expect: {data: {/selected: Tokyo}, actions: []}
    - key: enter
    - expect: {focused: table, actions: [openCity], context: {city: Tokyo}}
    - key: tab
    - expect: {focused: null}

- name: A HottyList's keys move its selection and turn its pages; / types a filter, Enter applies it and acts, Escape drops it
  story: hotty/list
  steps:
    - focus: things
    - expect: {focused: things, data: {/selected: raspberry-pis}}
    - key: arrow_down
    - expect: {data: {/selected: nutella}}
    - key: arrow_right
    - expect: {data: {/selected: plantasia-the-album}}
    - key: end
    - expect: {data: {/selected: business-school}}
    - key: home
    - expect: {data: {/selected: raspberry-pis}}
    - type: /no
    - expect: {focused: things, data: {/selected: noguchi-lamps}, actions: []}
    - key: enter
    - expect: {data: {/selected: noguchi-lamps}, actions: []}
    - key: enter
    - expect: {focused: things, actions: [openThing], context: {thing: noguchi-lamps}}
    - key: escape
    - expect: {focused: things, data: {/selected: raspberry-pis}}

