# Moves (profile §6.21): Alt with the arrows moves the item the keyboard is
# on a place, in a list whose items move; the items are written, the item
# stays selected, the move is written and onMove runs. On a host the
# element gives these keys to the program (data-keys ...=program).
- name: alt+arrow_up and alt+arrow_down move a reorderable HottyList's selected item a place, and stay at the ends
  story: hotty/drag-todo
  steps:
    - focus: list
    - key: alt+arrow_down
    - expect: {focused: list, actions: [moved], data: {/todos/0/value: plumber, /todos/1/value: milk, /selected: milk}, context: {move: {item: milk, from: {index: 0, path: /todos}, to: {index: 1, path: /todos}}}}
    - key: alt+arrow_up
    - expect: {actions: [moved, moved], data: {/todos/0/value: milk, /todos/1/value: plumber}}
    - key: alt+arrow_up
    - expect: {focused: list, actions: [moved, moved], data: {/todos/0/value: milk}}
    - key: arrow_down
    - key: alt+arrow_down
    - expect: {actions: [moved, moved, moved], data: {/todos/1/value: ferns, /todos/2/value: plumber, /selected: plumber}}

- name: alt+arrow_down moves a reorderable HottyTable's selected row, and ArrowDown then goes on from it
  story: hotty/drag-backlog
  steps:
    - focus: table
    - key: alt+arrow_down
    - key: alt+arrow_down
    - expect: {focused: table, actions: [reprioritized, reprioritized], data: {/backlog/2/key: KIT-31, /backlog/0/key: KIT-27, /selected: KIT-31}}
    - key: arrow_down
    - expect: {data: {/selected: KIT-22}}

- name: In a HottyTree, alt+arrow_left moves a node out of its branch, after it, and alt+arrow_right into the node above, as its last child, an empty folder too
  story: hotty/drag-files
  steps:
    - focus: tree
    - expect: {data: {/selected: main.go}}
    - key: alt+arrow_left
    - expect: {focused: tree, actions: [moved], data: {/files/2/value: main.go, /files/1/children/0/value: util, /selected: main.go}, context: {move: {item: main.go, from: {index: 0, parent: src, path: /files}, to: {index: 2, parent: null, path: /files}}}}
    - key: alt+arrow_right
    - expect: {actions: [moved, moved], data: {/files/1/children/1/value: main.go, /files/2/value: archive}}
    - key: end
    - key: alt+arrow_right
    - expect: {actions: [moved, moved, moved], data: {/files/2/children/0/value: README.md, /selected: README.md}}
    - key: alt+arrow_up
    - expect: {actions: [moved, moved, moved], data: {/files/2/children/0/value: README.md}}

- name: alt+arrow_down on a card moves it a place in its List, with the extension's reorder, and the keyboard goes with it
  story: hotty/drag-kanban
  steps:
    - focus: "card[/board/todo/0]"
    - key: alt+arrow_down
    - expect: {focused: "card[/board/todo/1]", actions: [moved], data: {/board/todo/0/id: c2, /board/todo/1/id: c1}, context: {move: {item: {id: c1, title: Draft the release notes}, from: {index: 0, path: /board/todo}, to: {index: 1, path: /board/todo}}}}
    - key: enter
    - expect: {focused: "card[/board/todo/1]", actions: [moved, open], context: {card: c1}}

# Suggestions (profile §6.22): io_neuroplast_hotty.suggestions on a
# TextField. A host's baseline is the field and a datalist, which hottytest
# draws nothing of, and a host keeps Tab, so the suggestions' own keys play
# on cells alone; what the field still does with them plays on both.
- name: A field with suggestions edits as ever, tells the agent each change by onInput, submits on Enter with nothing highlighted, and Tab with nothing to take moves on
  story: hotty/suggest
  steps:
    - focus: country
    - type: Sw
    - expect: {focused: country, actions: [suggest, suggest], context: {query: Sw}, data: {/country: Sw}}
    - key: backspace
    - type: x
    - expect: {actions: [suggest, suggest, suggest, suggest], context: {query: Sx}, data: {/country: Sx}}
    - key: tab
    - expect: {focused: city}
    - key: enter
    - expect: {actions: [suggest, suggest, suggest, suggest, go], context: {command: git c, country: Sx, city: Atlantis}}

- name: Tab takes the suggestion after the caret, and so does ArrowRight at the value's end; once taken, Tab moves on (cells; a host keeps Tab, vault KIT-11h)
  story: hotty/suggest
  renditions: [cells]
  steps:
    - expect: {focused: command}
    - key: tab
    - expect: {focused: command, data: {/command: git commit}}
    - key: tab
    - expect: {focused: country}
    - type: sw
    - key: arrow_left
    - key: arrow_right
    - expect: {data: {/country: sw}}
    - key: arrow_right
    - expect: {focused: country, actions: [suggest, suggest, suggest], context: {query: Sweden}, data: {/country: Sweden}}
    - key: tab
    - expect: {focused: city}
    - key: tab
    - expect: {focused: null}

- name: ArrowDown and ArrowUp (ctrl+n, ctrl+p) move through the suggestions, round from either end; Enter picks the highlighted one; Escape closes the list, and Enter then submits (cells; vault KIT-11h)
  story: hotty/suggest
  renditions: [cells]
  steps:
    - key: arrow_down
    - key: arrow_down
    - key: ctrl+n
    - key: arrow_up
    - key: enter
    - expect: {focused: command, actions: [], data: {/command: git checkout}}
    - key: backspace
    - key: arrow_up
    - key: ctrl+p
    - key: enter
    - expect: {actions: [], data: {/command: git checkout}}
    - key: backspace
    - key: backspace
    - key: backspace
    - expect: {data: {/command: git check}}
    - key: escape
    - key: enter
    - expect: {actions: [go], context: {command: git check}}
    - key: arrow_down
    - key: enter
    - expect: {actions: [go], data: {/command: git checkout}}

- name: Escape dismisses the newest toast, from a text field too, which keeps the keyboard; a click on a toast dismisses it, and takes the keyboard, as a click on a box does on a host
  story: hotty/toast
  steps:
    - expect: {toasts: [toast-3, toast-2, toast-1, offline]}
    - key: escape
    - expect: {focused: null, toasts: [toast-2, toast-1, offline]}
    - focus: email
    - key: escape
    - expect: {focused: email, toasts: [toast-1, offline]}
    - click: "hottyToast:toast-1"
    - expect: {focused: null, toasts: [offline], actions: []}

- name: A toast's action is the last Tab stop, after the surface's; Enter sends its event and dismisses the toast, and the keyboard goes with it
  story: hotty/toast
  steps:
    - focus: notify
    - key: tab
    - expect: {focused: "hottyToast:offline/action/0"}
    - key: enter
    - expect: {focused: null, actions: [retry], toasts: [toast-3, toast-2, toast-1]}

- name: Escape on a toast's action dismisses that toast, not the newest
  story: hotty/toast
  steps:
    - focus: "hottyToast:offline/action/0"
    - key: escape
    - expect: {focused: null, actions: [], toasts: [toast-3, toast-2, toast-1]}

- name: A click on a toast's action sends its event, with the context read as the toast showed
  story: hotty/toast
  steps:
    - click: delete
    - expect: {actions: [], toasts: [toast-4, toast-3, toast-2, toast-1, offline]}
    - click: "hottyToast:toast-4/action/0"
    - expect: {actions: [undoDelete], context: {draft: d-17}, toasts: [toast-3, toast-2, toast-1, offline]}

- name: A toast shown with the id of one there takes its place, and hottyDismissToast takes one away by its id
  story: hotty/toast
  steps:
    - click: upload
    - expect: {toasts: [upload, toast-3, toast-2, toast-1, offline]}
    - click: uploaded
    - expect: {toasts: [upload, toast-3, toast-2, toast-1, offline]}
    - click: stay
    - expect: {toasts: [pinned, upload, toast-3, toast-2, toast-1]}
    - click: unstay
    - expect: {actions: [], toasts: [upload, toast-3, toast-2, toast-1]}

- name: ← → and h l turn a focused HottyPaginator's pages, none past the ends, Home and End to them; a turn sends onChange's event, the page in its context
  story: hotty/paginator
